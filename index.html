<style>
:root{
  --rojo:#E53E3E; --rojo-btn:#C53030; --rojo-osc:#9B2C2C; --rojo-suave:#FFF1F1;
  --tinta:#1A202C; --texto:#2D3748; --gris:#5F6B7A; --borde:#E2E8F0; --fondo:#FFFFFF; --suave:#F7F7F8;
  --verde:#1E7B4A; --violeta:#6B46C1; --ambar:#B7791F;
  --radio:12px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.06);
  --f-tit:'Outfit',system-ui,sans-serif; --f-txt:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--f-txt);color:var(--texto);background:var(--fondo);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-tit);color:var(--tinta);line-height:1.15;margin:0 0 .5em}
h1{font-size:clamp(1.6rem,4vw,2.3rem)} h2{font-size:clamp(1.3rem,3vw,1.75rem)} h3{font-size:1.12rem}
a{color:inherit} img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid #F6AD55;outline-offset:2px}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:10px;border:1px solid var(--borde);background:#fff;cursor:pointer;font-weight:600;text-decoration:none;transition:.15s;white-space:nowrap}
.btn:hover{border-color:#CBD5E0;background:var(--suave)}
.btn-rojo{background:var(--rojo-btn);border-color:var(--rojo-btn);color:#fff}
.btn-rojo:hover{background:var(--rojo-osc);border-color:var(--rojo-osc)}
.btn-osc{background:var(--tinta);border-color:var(--tinta);color:#fff}
.btn-osc:hover{background:#000}
.btn-block{width:100%}
.btn-sm{min-height:36px;padding:6px 12px;font-size:.88rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--rojo-btn);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* ---------- Barra demo ---------- */
.demo-bar{background:#111;color:#E2E8F0;font-size:.82rem}
.demo-bar .wrap{display:flex;align-items:center;gap:10px;min-height:44px;flex-wrap:wrap;padding-top:4px;padding-bottom:4px}
.demo-tag{background:#F6AD55;color:#111;font-weight:800;border-radius:6px;padding:2px 8px;font-size:.72rem;letter-spacing:.04em}
.seg{display:inline-flex;background:#2A2A2A;border-radius:999px;padding:3px;margin-left:auto}
.seg button{border:0;background:none;color:#CBD5E0;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.82rem;min-height:34px}
.seg button.on{background:#fff;color:#111}
.demo-bar .reset{background:none;border:1px solid #444;color:#CBD5E0;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:.8rem;min-height:34px}

/* ---------- Header tienda ---------- */
.anuncio{background:var(--rojo-btn);color:#fff;text-align:center;font-size:.82rem;font-weight:600;padding:7px 12px}
.hdr{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--borde)}
.hdr-in{display:flex;align-items:center;gap:12px;min-height:66px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--tinta)}
.logo span{display:flex;flex-direction:column;line-height:1}
.logo b{font-family:var(--f-tit);font-size:1.3rem;font-weight:800;letter-spacing:-.01em}
.logo small{font-family:var(--f-tit);font-size:.9rem;color:var(--rojo-btn);font-weight:700;margin-top:2px}
.buscador{flex:1;display:flex;max-width:460px;margin-left:auto;border:1px solid var(--borde);border-radius:999px;overflow:hidden;background:var(--suave)}
.buscador input{flex:1;border:0;background:none;padding:10px 16px;min-width:0;min-height:42px}
.buscador input:focus{outline:none}
.buscador:focus-within{border-color:var(--rojo);box-shadow:0 0 0 3px rgba(229,62,62,.15)}
.buscador button{border:0;background:none;padding:0 14px;cursor:pointer;color:var(--gris)}
.estado{font-size:.78rem;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
.estado.on{background:#E6F6EC;color:var(--verde)} .estado.off{background:#F1F1F3;color:#4A5568}
.estado::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px}
.ico-btn{border:0;background:none;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;border-radius:10px;color:var(--tinta)}
.ico-btn:hover{background:var(--suave)}
.carrito-btn{position:relative;border:0;background:var(--tinta);color:#fff;height:44px;padding:0 14px;border-radius:999px;display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700}
.carrito-btn .badge{background:var(--rojo);color:#fff;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:.75rem;padding:0 6px}
.nav{border-top:1px solid var(--borde)}
.nav .wrap{display:flex;gap:2px;align-items:center}
.nav a,.nav .drop>button{display:inline-flex;align-items:center;gap:4px;padding:12px 14px;text-decoration:none;font-weight:600;color:var(--texto);border:0;background:none;cursor:pointer;border-bottom:3px solid transparent;font-size:.93rem}
.nav a:hover,.nav .drop>button:hover{color:var(--rojo-btn)}
.nav a.act{color:var(--rojo-btn);border-bottom-color:var(--rojo)}
.drop{position:relative}
.drop-menu{display:none;position:absolute;top:100%;left:0;background:#fff;border:1px solid var(--borde);border-radius:12px;box-shadow:var(--sombra);padding:8px;grid-template-columns:repeat(2,minmax(180px,1fr));z-index:50}
.drop:hover .drop-menu,.drop:focus-within .drop-menu{display:grid}
.drop-menu a{padding:9px 12px;border-radius:8px;border:0;font-weight:500}
.drop-menu a:hover{background:var(--rojo-suave)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.solo-movil{display:none!important}

/* ---------- Menú móvil ---------- */
.capa{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;opacity:0;pointer-events:none;transition:.2s}
.capa.on{opacity:1;pointer-events:auto}
.lateral{position:fixed;top:0;bottom:0;width:min(88vw,400px);background:#fff;z-index:90;transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.2)}
.lateral.izq{left:0;transform:translateX(-102%)} .lateral.der{right:0;transform:translateX(102%)}
.lateral.on{transform:none}
.lat-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--borde)}
.lat-body{flex:1;overflow:auto;padding:12px 16px}
.lat-ftr{border-top:1px solid var(--borde);padding:14px 16px;background:var(--suave)}
.menu-mov a{display:flex;align-items:center;gap:10px;padding:12px 6px;text-decoration:none;font-weight:600;border-bottom:1px solid #F1F1F3}
.menu-mov .sub{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--gris);margin:16px 0 4px;font-weight:700}

/* ---------- Secciones ---------- */
main{min-height:60vh}
.sec{padding:40px 0}
.sec-alt{background:var(--suave)}
.sec-hdr{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.sec-hdr h2{margin:0}
.sec-hdr p{margin:4px 0 0;color:var(--gris)}
.hero{background:radial-gradient(1200px 400px at 85% 0%,#FF6B6B33,transparent),linear-gradient(135deg,#1A202C 0%,#2D1B1B 55%,#9B2C2C 100%);color:#fff;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:24px;align-items:center;padding-top:48px;padding-bottom:48px}
.hero h1{color:#fff;font-size:clamp(1.9rem,5vw,3rem);letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:#FEB2B2}
.hero p{color:#E2E8F0;font-size:1.05rem;max-width:520px}
.hero .ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.hero .btn-out{background:transparent;color:#fff;border-color:#ffffff66}
.hero .btn-out:hover{background:#ffffff1a}
.hero-art{position:relative;height:280px}
.hero-art .hc{position:absolute;width:150px;height:210px;border-radius:12px;box-shadow:0 20px 40px rgba(0,0,0,.4);border:4px solid #fff}
.beneficios{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:18px 0}
.benef{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;background:#fff;border:1px solid var(--borde)}
.benef .ic{width:40px;height:40px;border-radius:10px;background:var(--rojo-suave);color:var(--rojo-btn);display:grid;place-items:center;flex:none}
.benef b{display:block;font-size:.92rem;color:var(--tinta)} .benef small{color:var(--gris);font-size:.8rem}
.juegos{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.juego{position:relative;border-radius:14px;padding:16px 14px;min-height:96px;color:#fff;text-decoration:none;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;transition:transform .15s}
.juego:hover{transform:translateY(-2px)}
.juego b{font-family:var(--f-tit);font-size:1.02rem;position:relative}
.juego small{opacity:.9;font-size:.78rem;position:relative}
.juego::after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:96px;border-radius:10px;border:3px solid #ffffff55;transform:rotate(18deg)}

/* ---------- Tarjetas producto ---------- */
.grilla{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{background:#fff;border:1px solid var(--borde);border-radius:var(--radio);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s}
.card:hover{box-shadow:var(--sombra)}
.grilla-s{grid-template-columns:repeat(5,1fr)}
@media (max-width:1024px){.grilla-s{grid-template-columns:repeat(3,1fr)}}
@media (max-width:820px){.grilla-s{grid-template-columns:repeat(2,1fr)}}
.card-img{position:relative;display:block;aspect-ratio:1/1;background:var(--suave)}
.card-img img{width:100%;height:100%;object-fit:cover}
.badges{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.b{font-size:.7rem;font-weight:800;padding:3px 8px;border-radius:6px;letter-spacing:.02em;color:#fff;text-transform:uppercase}
.b-off{background:var(--rojo-btn)} .b-new{background:var(--tinta)} .b-pre{background:var(--violeta)} .b-env{background:var(--verde)}
.card.agotado .card-img img{filter:grayscale(1);opacity:.55}
.sello-agotado{position:absolute;inset:auto 0 42% 0;margin:auto;width:max-content;background:#fff;color:var(--tinta);font-weight:800;padding:6px 14px;border-radius:8px;text-transform:uppercase;font-size:.8rem;box-shadow:var(--sombra)}
.card-body{padding:12px 12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.card-cat{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--gris);font-weight:700}
.card-nombre{font-weight:600;color:var(--tinta);text-decoration:none;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.card-nombre:hover{color:var(--rojo-btn)}
.precios{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:2px}
.precios s{color:var(--gris);font-size:.86rem}
.precios strong{font-size:1.18rem;color:var(--tinta);font-family:var(--f-tit)}
.transf{font-size:.8rem;color:var(--verde);font-weight:600}
.limite{font-size:.75rem;color:var(--ambar);font-weight:600}
.card .btn{margin-top:auto}
.card-body .sp{flex:1}

/* ---------- Catálogo ---------- */
.migas{font-size:.85rem;color:var(--gris);padding:16px 0 4px}
.migas a{color:var(--gris);text-decoration:none} .migas a:hover{color:var(--rojo-btn)}
.cat-layout{display:grid;grid-template-columns:250px 1fr;gap:28px;padding-bottom:40px}
.filtros h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--gris);margin:18px 0 8px}
.filtros h3:first-child{margin-top:0}
.f-cat{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:left;font-weight:500;min-height:38px}
.f-cat:hover{background:var(--suave)}
.f-cat.on{background:var(--rojo-suave);color:var(--rojo-osc);font-weight:700}
.f-cat .n{margin-left:auto;font-size:.78rem;color:var(--gris)}
.chk{display:flex;align-items:center;gap:10px;padding:6px 2px;cursor:pointer;min-height:36px}
.chk input{width:18px;height:18px;accent-color:var(--rojo-btn)}
.rango{display:flex;gap:8px}
.rango input{width:100%}
.inp,.sel,textarea.inp{width:100%;border:1px solid #CBD5E0;border-radius:10px;padding:9px 12px;background:#fff;min-height:44px}
.inp:focus,.sel:focus{outline:none;border-color:var(--rojo);box-shadow:0 0 0 3px rgba(229,62,62,.15)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.toolbar h1{margin:0}
.toolbar .der{display:flex;gap:8px;align-items:center}
.conteo{color:var(--gris);font-size:.88rem;margin:0 0 12px}
.mas{text-align:center;margin:26px 0 0}
.mas p{color:var(--gris);font-size:.85rem;margin:0 0 10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--borde);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:.86rem;min-height:38px}
.chip.on{background:var(--tinta);border-color:var(--tinta);color:#fff}
.vacio{text-align:center;padding:48px 20px;border:2px dashed var(--borde);border-radius:16px;background:#fff}
.vacio .ic{width:64px;height:64px;margin:0 auto 12px;border-radius:16px;background:var(--rojo-suave);display:grid;place-items:center;color:var(--rojo-btn)}
.vacio p{color:var(--gris);max-width:460px;margin:6px auto 16px}

/* ---------- Ficha ---------- */
.ficha{display:grid;grid-template-columns:1fr 1fr;gap:36px;padding:10px 0 40px}
.ficha-img{border-radius:16px;overflow:hidden;border:1px solid var(--borde);aspect-ratio:1/1;background:var(--suave);position:relative}
.ficha-img img{width:100%;height:100%;object-fit:cover}
.ficha .precios strong{font-size:2rem}
.ficha .transf{font-size:.95rem}
.qty{display:inline-flex;align-items:center;border:1px solid #CBD5E0;border-radius:10px;overflow:hidden}
.qty button{width:44px;height:44px;border:0;background:#fff;cursor:pointer;font-size:1.2rem}
.qty button:hover{background:var(--suave)}
.qty span{min-width:40px;text-align:center;font-weight:700}
.info-list{list-style:none;padding:0;margin:20px 0 0;border:1px solid var(--borde);border-radius:12px}
.info-list li{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--borde);font-size:.9rem}
.info-list li:last-child{border:0}
.info-list .ic{color:var(--rojo-btn);flex:none}
.stock-txt{font-size:.88rem;font-weight:600}

/* ---------- Torneos ---------- */
.semana{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.dia{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:12px;min-height:150px}
.dia.hoy{border-color:var(--rojo);box-shadow:0 0 0 3px rgba(229,62,62,.12)}
.dia h3{font-size:1rem;display:flex;justify-content:space-between;align-items:center}
.hoy-tag{font-size:.65rem;background:var(--rojo-btn);color:#fff;padding:2px 7px;border-radius:999px;font-family:var(--f-txt)}
.ev{border-radius:10px;padding:10px;margin-top:8px;background:var(--suave);border-left:4px solid var(--c,#888)}
.ev b{display:block;font-size:.9rem;color:var(--tinta);line-height:1.25}
.ev .h{font-weight:800;font-family:var(--f-tit);font-size:.95rem}
.ev small{display:block;color:var(--gris);font-size:.78rem}
.ev a{font-size:.78rem;font-weight:600;color:var(--rojo-btn)}
.ev-card{display:flex;gap:14px;background:#fff;border:1px solid var(--borde);border-radius:14px;padding:14px;align-items:center}
.ev-fecha{width:62px;height:62px;border-radius:12px;background:var(--c,#888);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;font-family:var(--f-tit)}
.ev-fecha b{font-size:1.15rem;line-height:1} .ev-fecha small{font-size:.7rem;text-transform:uppercase;font-weight:700}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.caja{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:18px}
.post-img{aspect-ratio:16/9;border-radius:10px;overflow:hidden;margin:-4px -4px 12px}
.post-meta{font-size:.78rem;color:var(--gris);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.articulo{max-width:740px;margin:0 auto;padding:10px 0 50px}
.articulo p{font-size:1.04rem;line-height:1.7}
.banda{background:linear-gradient(120deg,var(--rojo-btn),#7B1F1F);color:#fff;border-radius:18px;padding:28px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.banda h2{color:#fff;margin:0 0 6px}
.banda p{margin:0;color:#FED7D7}
.tabla-h{width:100%;border-collapse:collapse}
.tabla-h td{padding:9px 4px;border-bottom:1px solid var(--borde)}
.tabla-h tr.hoy td{font-weight:700;color:var(--rojo-osc)}
.mapa{border-radius:14px;overflow:hidden;border:1px solid var(--borde);aspect-ratio:16/10;background:#E9EEF2;position:relative}

/* ---------- Checkout ---------- */
.co{display:grid;grid-template-columns:1fr 380px;gap:28px;padding:10px 0 50px;align-items:start}
.paso{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:18px;margin-bottom:16px}
.paso h2{font-size:1.15rem;display:flex;align-items:center;gap:10px}
.paso h2 .num{width:28px;height:28px;border-radius:50%;background:var(--tinta);color:#fff;display:grid;place-items:center;font-size:.9rem}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.campo label{display:block;font-weight:600;font-size:.86rem;margin-bottom:5px;color:var(--tinta)}
.campo.full{grid-column:1/-1}
.err{color:var(--rojo-btn);font-size:.8rem;font-weight:600;margin-top:4px;min-height:0}
.opcion{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--borde);border-radius:12px;cursor:pointer;margin-bottom:10px;transition:.15s}
.opcion:hover{border-color:#CBD5E0}
.opcion.on{border-color:var(--rojo);background:var(--rojo-suave)}
.opcion input{margin-top:3px;width:18px;height:18px;accent-color:var(--rojo-btn)}
.opcion b{display:block;color:var(--tinta)} .opcion small{color:var(--gris)}
.opcion .pr{margin-left:auto;font-weight:700;white-space:nowrap;color:var(--tinta)}
.resumen{position:sticky;top:130px}

/* ---------- Hora y estado Abierto/Cerrado (hora argentina) ---------- */
function ahoraAR(){
  const p = new Intl.DateTimeFormat('en-US',{timeZone:TZ,weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
  const g = t => p.find(x => x.type === t).value;
  const d = {Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[g('weekday')];
  return {dia:d, min:(+g('hour'))*60 + (+g('minute'))};
}
const aMin = h => { const [a,b] = h.split(':').map(Number); return a*60 + b; };
function estadoLocal(){
  const {dia, min} = ahoraAR(); const H = db.config.horarios;
  const hoy = H[dia];
  if(hoy && min >= aMin(hoy.a) && min < aMin(hoy.c)) return {abierto:true, texto:'Abierto · cierra ' + hoy.c};
  for(let i = 0; i < 8; i++){
    const d = (dia + i) % 7, h = H[d];
    if(!h) continue;
    if(i === 0 && min < aMin(h.a)) return {abierto:false, texto:'Cerrado · abre hoy ' + h.a};
    if(i > 0) return {abierto:false, texto:'Cerrado · abre ' + (i === 1 ? 'mañana' : DIAS_C[d].toLowerCase()) + ' ' + h.a};
  }
  return {abierto:false, texto:'Cerrado'};
}

function agregar(id, q = 1){
  const it = buscarItem(id); if(!it) return;
  const linea = cart.find(c => c.id === id);

const VISTAS = ['inicio','productos','producto','singles','torneos','clases','comunidad','post','nosotros','checkout','gracias','panel'];
function leerHash(){
  const h = (location.hash || '#inicio').slice(1);
  const i = h.indexOf('-');
  const v = i > 0 ? h.slice(0,i) : h, p = i > 0 ? h.slice(i+1) : '';
  if(!VISTAS.includes(v)) return {v:'inicio', p:''};
  return {v, p};
}
function aplicarRuta(){
  const {v, p} = leerHash();
  if(v === 'panel'){ st.modo = 'panel'; if(p) st.ptab = p; }
  else { st.modo = 'tienda'; st.vista = v; st.param = p;
    if(v === 'productos'){ st.f.cat = p && CATS.some(c => c.k === p) ? p : ''; }
    if(v === 'producto') st.qty = 1;
  }

  render(); window.scrollTo(0,0);
}
function ir(v, p){

  document.body.className = st.modo === 'tienda' ? 'tienda' : 'modo-panel';

  if(st.modo === 'panel'){ app.innerHTML = barraDemo() + vPanel(); return; }
  app.innerHTML = barraDemo() + header() + '<main id="main">' + vista() + '</main>' + footer() + bottomNav() + menuMovil() + drawerCarrito() + bannerCookies();
  document.title = tituloVista();
}

const POR_PAGINA = 12;
function filtrarProductos(){
  const f = st.f, q = f.q.trim().toLowerCase();
  let r = db.productos.filter(p =>
    (!f.cat || p.cat === f.cat) && (!q || (p.nombre + ' ' + catBy(p.cat).n).toLowerCase().includes(q)) &&
    (!f.tipos.length || f.tipos.includes(p.tipo)) && (!f.min || p.precio >= +f.min) && (!f.max || p.precio <= +f.max) &&
    (!f.stock || p.stock > 0) && (!f.oferta || off(p) > 0) && (!f.preventa || p.preventa) && (!f.nuevos || p.nuevo));
  const cmp = {
    destacado:(a,b) => (b.destacado - a.destacado) || ((b.stock>0) - (a.stock>0)) || b.ventas - a.ventas,
    vendidos:(a,b) => b.ventas - a.ventas, 'precio-asc':(a,b) => a.precio - b.precio, 'precio-desc':(a,b) => b.precio - a.precio,
    az:(a,b) => a.nombre.localeCompare(b.nombre,'es'), za:(a,b) => b.nombre.localeCompare(a.nombre,'es'),
    nuevo:(a,b) => b.alta - a.alta, viejo:(a,b) => a.alta - b.alta
  }[f.orden];
  return r.sort(cmp);
}

function vTorneos(){
  const {dia} = ahoraAR(), H = db.config.horarios, f = st.tf;
  const juegos = [...new Set(db.eventos.map(e => e.juego))];
  // Los próximos 7 días empezando por hoy (se saltean los días cerrados sin eventos)
  const orden = [0,1,2,3,4,5,6].map(i => (dia + i) % 7).filter(d => H[d] || db.eventos.some(e => e.dia === d));
  return `<div class="wrap"><nav class="migas"><a href="#inicio">Inicio</a> / Torneos</nav>
    <div class="toolbar"><div><h1>Torneos de la semana</h1><p style="color:var(--gris);margin:4px 0 0">Inscripción en el local hasta 15 minutos antes de empezar. Lunes cerrado.</p></div></div>
    <div class="chips" style="margin-bottom:16px"><button class="chip ${!f?'on':''}" data-a="tfiltro" data-k="">Todos los juegos</button>${juegos.map(k => { const c = catBy(k); return `<button class="chip ${f===k?'on':''}" data-a="tfiltro" data-k="${k}"><span class="dot" style="background:${c.c}"></span>${c.n}</button>`; }).join('')}</div>
    <div class="semana">${orden.map(d => {
      const evs = db.eventos.filter(e => e.dia === d && (!f || e.juego === f)).sort((a,b) => aMin(a.hora) - aMin(b.hora));
      const fecha = proximaFecha(d).toLocaleDateString('es-AR',{timeZone:TZ,day:'2-digit',month:'2-digit'});
      return `<div class="dia ${d===dia?'hoy':''}"><h3>${DIAS[d]} <small style="color:var(--gris);font-weight:500;font-family:var(--f-txt);font-size:.78rem">${fecha}</small>${d===dia?'<span class="hoy-tag">HOY</span>':''}</h3>
        <small style="color:var(--gris)">${H[d]?'Abre '+H[d].a+' a '+H[d].c:'Cerrado'}</small>
        ${evs.length ? evs.map(e => { const c = catBy(e.juego); return `<div class="ev" style="--c:${c.c}"><span class="h">${e.hora}</span><b>${esc(e.nombre)}</b><small>${esc(c.n)} · ${esc(e.formato)}</small><small>${e.costo?'Inscripción '+$$(e.costo):'Entrada libre'} · Cupo ${e.cupo}</small><small>Premios: ${esc(e.premio)}</small><a href="${linkCalendario(e)}" target="_blank" rel="noopener">+ Agregar a mi calendario</a></div>`; }).join('') : '<p style="color:var(--gris);font-size:.85rem;margin-top:10px">Sin eventos programados</p>'}
      </div>`; }).join('')}</div>
    <div class="aviso" style="margin:20px 0 40px">Los torneos pueden cambiar por feriados o eventos especiales. Seguinos en Instagram para enterarte de todo.</div></div>`;
}
function linkCalendario(e){
  const d = proximaFecha(e.dia);
  const ymd = d.toLocaleDateString('en-CA',{timeZone:TZ}).replace(/-/g,'');
  const [h,m] = e.hora.split(':').map(Number), fin = h*60 + m + 180;
  const t = (x) => String(Math.floor(x/60)%24).padStart(2,'0') + String(x%60).padStart(2,'0') + '00';
  const p = new URLSearchParams({action:'TEMPLATE', text:e.nombre + ' — El Ático de Hisui', dates:`${ymd}T${t(h*60+m)}/${ymd}T${t(fin)}`, ctz:TZ, details:`${catBy(e.juego).n} · ${e.formato}`, location:db.config.direccion + ', San Martín de los Andes'});
  return 'https://calendar.google.com/calendar/render?' + p.toString();
}

function validarCheckout(){
  const co = st.co, E = {};
  if(co.nombre.trim().length < 3) E.nombre = 'Escribí tu nombre y apellido';
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(co.email.trim())) E.email = 'Revisá el email';
  if(co.tel.replace(/\D/g,'').length < 8) E.tel = 'Escribí un teléfono válido';
  if(co.entrega !== 'retiro' && co.direccion.trim().length < 4) E.direccion = 'Escribí la dirección de entrega';
  if(co.entrega === 'pais'){
    if(!co.provincia) E.provincia = 'Elegí la provincia';
    if(co.ciudad.trim().length < 2) E.ciudad = 'Escribí la ciudad';
    if(!/^\w{4,8}$/.test(co.cp.trim())) E.cp = 'Revisá el código postal';
  }
  st.errores = E; return !Object.keys(E).length;
}
function confirmarCompra(){
  if(!validarCheckout()){ render(); const el = document.querySelector('.err'); if(el) el.closest('.campo').scrollIntoView({behavior:'smooth',block:'center'}); toast('Revisá los datos marcados'); return; }
  for(const c of itemsCarrito()){ if(c.qty > maxPermitido(c.item)){ toast(`No hay stock suficiente de “${c.item.nombre}”`); return; } }
  track('begin_checkout', {currency:'ARS', value:calc().total});
  if(st.co.pago === 'mp'){
    const k = calc();
    abrirModal(`<div class="mp-head"><b style="font-size:1.1rem">mercado pago</b><span class="sim">Simulado en la demo</span></div>
      <p style="margin:0 0 4px;color:var(--gris)">Pagás a <b>El Ático de Hisui</b></p><p style="font-size:1.8rem;font-weight:800;font-family:var(--f-tit);margin:0 0 14px">${$$(k.total)}</p>
      <p style="font-size:.9rem">En la versión real, acá se abre Mercado Pago para pagar con tarjeta, débito, dinero en cuenta o cuotas. Elegí cómo termina el pago de prueba:</p>

    return;

}
function crearPedido(estado){
  const k = calc(), co = st.co, num = db.proximo++;
  const ped = {num, fecha:new Date().toISOString(), cliente:{nombre:co.nombre.trim(), email:co.email.trim(), tel:co.tel.trim()},

    entrega:{tipo:co.entrega, direccion:co.direccion, ciudad:co.entrega==='sma'?'San Martín de los Andes':co.ciudad, provincia:co.entrega==='pais'?co.provincia:'Neuquén', cp:co.cp},
    pago:co.pago, subtotal:k.sub, descuento:k.desc, envio:k.envio||0, total:k.total, estado, nota:co.nota, comprobante:'', stockDevuelto:false};
  k.items.forEach(i => { i.item.stock -= i.qty; i.item.ventas = (i.item.ventas||0) + i.qty; });
  db.pedidos.unshift(ped); guardar();

}

function cambiarEstado(num, est){

let formActual = null;
function guardarForm(f){
  const {esquema, obj, alGuardar} = formActual, out = {};
  for(const c of esquema){
    if(c.t === 'image'){ out[c.k] = c.k in formImg ? formImg[c.k] : (obj[c.k] || ''); continue; }
    const el = f.elements[c.k]; if(!el) continue;
    if(c.t === 'check') out[c.k] = el.checked;
    else if(c.t === 'number' || c.num) out[c.k] = Math.max(0, Math.round(+el.value || 0));
    else out[c.k] = el.value.trim();
    if(c.req && (out[c.k] === '' || (c.t === 'number' && !el.value))){ $('#ff-err').textContent = 'Completá: ' + c.l; el.focus(); return; }

/* ---------- Imágenes: se achican antes de guardar ---------- */
function achicarImg(file, max = 640){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const im = new Image(); im.onload = () => {
      const s = Math.min(1, max/Math.max(im.width, im.height)), cv = document.createElement('canvas');
      cv.width = Math.round(im.width*s); cv.height = Math.round(im.height*s);
      const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(im,0,0,cv.width,cv.height);
      res(cv.toDataURL('image/jpeg', .8)); }; im.onerror = rej; im.src = r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

/* ---------- CSV ---------- */
function aCSV(filas){ return filas.map(f => f.map(v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; }).join(';')).join('\n'); }
function leerCSV(txt){
  const sep = (txt.split('\n')[0].match(/;/g)||[]).length >= (txt.split('\n')[0].match(/,/g)||[]).length ? ';' : ',';
  const filas = []; let fila = [], cel = '', q = false;
  for(let i = 0; i < txt.length; i++){
    const ch = txt[i];
    if(q){ if(ch === '"' && txt[i+1] === '"'){ cel += '"'; i++; } else if(ch === '"') q = false; else cel += ch; }
    else if(ch === '"') q = true; else if(ch === sep){ fila.push(cel); cel = ''; }
    else if(ch === '\n'){ fila.push(cel); filas.push(fila); fila = []; cel = ''; } else if(ch !== '\r') cel += ch;
  }
  if(cel || fila.length){ fila.push(cel); filas.push(fila); }
  return filas.filter(f => f.some(c => c.trim()));
}

  comprar:['Cómo comprar','<ol><li>Elegí tus productos y agregalos al carrito.</li><li>Tocá “Finalizar compra” y completá tus datos (no hace falta crear cuenta).</li><li>Elegí retiro en el local o envío.</li><li>Pagá con Mercado Pago, transferencia (con descuento) o en el local al retirar.</li><li>Te llega un email con el número de pedido y te avisamos cuando esté listo.</li></ol>'],
  envios:['Envíos y retiros',()=>`<p><b>Retiro en el local:</b> sin cargo, en horario de atención, con tu número de pedido.</p><p><b>Envío en San Martín de los Andes:</b> ${$$(db.config.costoSMA)}, en 24 a 48 h hábiles.</p><p><b>Resto del país:</b> ${db.config.zonas.map(z => `${z.n} ${$$(z.costo)}`).join(' · ')}. Entrega de 3 a 7 días hábiles.</p>${db.config.envioGratisDesde>0?`<p><b>Envío gratis</b> en compras desde ${$$(db.config.envioGratisDesde)}.</p>`:''}`],
  faq:['Preguntas frecuentes','<p><b>¿Los productos son originales?</b><br>Sí, todo lo que vendemos es original y sellado.</p><p><b>¿Puedo reservar una preventa?</b><br>Sí, pagás online y la retirás o te la enviamos cuando llega.</p><p><b>¿Hay límite de compra?</b><br>Algunos productos muy pedidos tienen máximo por cliente para que lleguen a más jugadores.</p><p><b>¿Cómo me anoto a un torneo?</b><br>En el local, hasta 15 minutos antes de empezar.</p>'],
  privacidad:['Política de privacidad','<p>Usamos tus datos (nombre, email, teléfono y dirección) solo para procesar tu compra y avisarte el estado del pedido, según la Ley 25.326 de Protección de Datos Personales. No los vendemos ni los compartimos con terceros, salvo el correo para hacer el envío.</p><p>Podés pedir ver, corregir o borrar tus datos escribiéndonos por email.</p><p>Si aceptás, medimos visitas de forma anónima con Google Analytics y Microsoft Clarity, sin enviarles datos personales.</p><p style="color:var(--gris)">(Texto de ejemplo: revisarlo con el cliente.)</p>'],
  terminos:['Términos y condiciones','<p>Los precios están en pesos argentinos e incluyen IVA. El stock se reserva al confirmar el pedido. Los pedidos con transferencia se cancelan si no se recibe el pago en 48 h.</p><p>Podés arrepentirte de una compra online dentro de los 10 días corridos desde que la recibiste usando el Botón de arrepentimiento, con el producto sin abrir.</p><p style="color:var(--gris)">(Texto de ejemplo: revisarlo con el cliente.)</p>']
};
function mostrarInfo(k){ const [t,h] = INFO[k]; abrirModal(`<button class="ico-btn m-x" data-a="mclose" aria-label="Cerrar">${I.x}</button><h2>${t}</h2>${typeof h === 'function' ? h() : h}<div class="m-acc"><button class="btn btn-osc" data-a="mclose">Entendido</button></div>`); }
function arrepentimiento(){
  abrirModal(`<button class="ico-btn m-x" data-a="mclose" aria-label="Cerrar">${I.x}</button><h2>Botón de arrepentimiento</h2><p style="color:var(--gris);font-size:.9rem">Tenés 10 días corridos desde que recibiste tu compra para cancelarla. Completá los datos y te respondemos con un código de seguimiento.</p>
    <form data-form="arrep" novalidate><div class="form-g"><div class="campo"><label for="ar-n">N.º de pedido</label><input id="ar-n" class="inp" name="num" inputmode="numeric" required></div><div class="campo"><label for="ar-e">Email de la compra</label><input id="ar-e" class="inp" name="email" type="email" required data-clarity-mask="true"></div>
    <div class="campo full"><label for="ar-m">Motivo (opcional)</label><textarea id="ar-m" class="inp" name="motivo" rows="2"></textarea></div></div><div class="err" id="ar-err"></div>
    <div class="m-acc"><button type="button" class="btn" data-a="mclose">Cancelar</button><button class="btn btn-rojo">Enviar solicitud</button></div></form>`);
}

/* =========================================================
   EVENTOS (delegación)
   ========================================================= */
const A = {
  modo:(el) => { const m = el.dataset.m; if(m === 'panel'){ if(el.dataset.t) st.ptab = el.dataset.t; ir('panel', st.ptab === 'resumen' ? '' : st.ptab); } else ir('inicio'); },
  reset:() => confirmar('Se borran los cambios y vuelven los datos de ejemplo.', () => { db = seed(); cart = []; guardar(); guardarCarrito(); st.ultimo = null; render(); toast('Datos de ejemplo restablecidos'); }, 'Sí, restablecer'),
  menu:() => { st.menu = true; render(); },
  carrito:() => { st.carrito = true; render(); },
  cerrarTodo:() => { st.menu = false; st.carrito = false; render(); },
  filtros:() => { st.filtrosAb = !st.filtrosAb; render(); },
  fcat:(el) => { st.pagina = 1; ir('productos', el.dataset.k); },
  flimpiar:() => { Object.assign(st.f, {cat:'', q:'', tipos:[], min:'', max:'', stock:false, oferta:false, preventa:false, nuevos:false}); st.pagina = 1; st.filtrosAb = false; ir('productos'); },
  limpiarQ:() => { st.f.q = ''; st.pagina = 1; render(); },
  mas:() => { st.pagina++; refrescarResultados(); },
  add:(el) => agregar(el.dataset.id, 1),
  addq:(el) => agregar(el.dataset.id, st.qty),
  pq:(el) => { const d = +el.dataset.d, p = db.productos.find(x => x.id === st.param), max = p ? maxPermitido(p) : 1; st.qty = Math.min(Math.max(1, st.qty + d), Math.max(1,max)); if(d > 0 && st.qty === max && max > 0) toast(p.limite && p.limite <= p.stock ? `Máximo ${p.limite} por cliente` : `Quedan ${p.stock}`); render(); },
  cq:(el) => { const l = cart.find(c => c.id === el.dataset.id), it = buscarItem(el.dataset.id); if(!l) return; const n = l.qty + (+el.dataset.d); if(n > maxPermitido(it)){ toast(it.limite && it.limite < it.stock ? `Máximo ${it.limite} por cliente` : `Solo quedan ${it.stock}`); return; } if(n <= 0) cart = cart.filter(c => c !== l); else l.qty = n; guardarCarrito(); render(); },
  cquitar:(el) => { cart = cart.filter(c => c.id !== el.dataset.id); guardarCarrito(); render(); },
  irCheckout:() => { st.carrito = false; ir('checkout'); },
  confirmar:() => confirmarCompra(),
  mpAprobar:() => crearPedido('Pagado'),
  mpRechazar:() => { cerrarModal(); toast('El pago fue rechazado. Probá con otra tarjeta o elegí transferencia.'); },
  sjuego:(el) => { st.sf.juego = el.dataset.k; st.sf.exp = ''; render(); },
  slimpiar:() => { st.sf = {juego:'', q:'', exp:'', idioma:'', rareza:'', cond:'', orden:'nombre'}; render(); },
  tfiltro:(el) => { st.tf = el.dataset.k; render(); },
  bcat:(el) => { st.blogCat = el.dataset.k; render(); },
  info:(el) => mostrarInfo(el.dataset.i),
  arrepentimiento:() => arrepentimiento(),
  cookies:(el) => { sSet(KEY+'_cookies', el.dataset.v); if(el.dataset.v === 'si') cargarMedicion(); render(); },
  consultaClase:(el) => { const c = db.clases.find(x => x.id === el.dataset.id);
    abrirModal(`<button class="ico-btn m-x" data-a="mclose" aria-label="Cerrar">${I.x}</button><h2>${esc(c.titulo)}</h2><p style="color:var(--gris)">${DIAS[c.dia]} ${c.hora} h · ${$$(c.precio)} por clase</p>
    <form data-form="contacto" data-clase="${esc(c.titulo)}" novalidate><div class="campo" style="margin-bottom:10px"><label for="cc-n">Nombre</label><input id="cc-n" class="inp" name="nombre" required data-clarity-mask="true"></div><div class="campo" style="margin-bottom:10px"><label for="cc-e">Email</label><input id="cc-e" class="inp" name="email" type="email" required data-clarity-mask="true"></div><div class="campo"><label for="cc-m">Mensaje</label><textarea id="cc-m" class="inp" name="mensaje" rows="3" data-clarity-mask="true">Hola, quiero más info sobre la clase.</textarea></div>
    <div class="m-acc"><button type="button" class="btn" data-a="mclose">Cancelar</button><button class="btn btn-rojo">Enviar</button></div><p style="font-size:.78rem;color:var(--gris)"><span class="sim">Simulado en la demo</span> La consulta llega al panel del local.</p></form>`); },
  copiar:async (el) => { const t = el.dataset.from ? $('#'+el.dataset.from).value : el.dataset.t; try{ await navigator.clipboard.writeText(t); toast('Copiado ✔'); }catch(e){ if(el.dataset.from){ $('#'+el.dataset.from).select(); } toast('Seleccioná el texto y copialo'); } },
  descargar:(el) => descargar(el.dataset.n, $('#csv-txt').value),
  mclose:() => cerrarModal(),
  // Panel
  ptab:(el) => ir('panel', el.dataset.t === 'resumen' ? '' : el.dataset.t),
  verPedido:(el) => verPedido(el.dataset.num),
  marcarPagado:(el) => { cambiarEstado(el.dataset.num, 'Pagado'); cerrarModal(); render(); },
  editProd:(el) => editarEn('productos', el.dataset.id, ESQ_PROD, 'producto', {cat:'pokemon', tipo:'Sellado', stock:0, limite:0, antes:0, ventas:0, alta:Date.now(), desc:'', img:''}),
  editSingle:(el) => editarEn('singles', el.dataset.id, ESQ_SINGLE, 'carta', {juego:'pokemon', idioma:'Español', rareza:'Común', condicion:'NM', stock:1, img:''}),
  editGen:(el) => { const col = el.dataset.col, e = ESQUEMAS[col]; const ex = db[col].find(x => x.id === el.dataset.id);
    abrirForm((ex ? 'Editar ' : 'Nueva ') + e.titulo, e.campos, ex ? {...ex, dia:String(ex.dia)} : {dia:'6', juego:'pokemon', fecha:new Date().toISOString(), cat:'Novedades'}, vals => {
      if(ex) Object.assign(ex, vals); else db[col].unshift({id:uid(e.pre), fecha:new Date().toISOString(), costo:0, cupo:0, precio:0, ...vals});
      if(guardar()) toast('Guardado ✔'); }); },
  borrar:(el) => { const col = el.dataset.col, it = db[col].find(x => x.id === el.dataset.id); if(!it) return;
    confirmar(`Vas a borrar “${esc(it.nombre || it.titulo)}”. Esto no se puede deshacer.`, () => { db[col] = db[col].filter(x => x !== it); cart = cart.filter(c => c.id !== it.id); guardarCarrito(); guardar(); render(); toast('Borrado'); }); },
  quitarImg:(el) => { formImg[el.dataset.k] = ''; $('#prev-'+el.dataset.k).src = 'data:image/gif;base64,R0lGODlhAQABAAAAACw='; el.remove(); },
  cargarEj:() => { db.singles = [...singlesEjemplo(), ...db.singles]; guardar(); render(); toast('Se cargaron 8 cartas de ejemplo. Mirá la tienda → Singles'); },
  quitarEj:() => { db.singles = db.singles.filter(x => !x.ejemplo); guardar(); render(); toast('Ejemplos quitados'); },
  importar:() => {
    abrirModal(`<button class="ico-btn m-x" data-a="mclose" aria-label="Cerrar">${I.x}</button><h2>Importar singles desde un archivo</h2>
      <p style="font-size:.9rem">1. Armá una planilla en Excel o Google Sheets con estas columnas, en este orden:</p>
      <code style="display:block;background:var(--suave);padding:10px;border-radius:8px;font-size:.8rem;word-break:break-all">${CSV_SINGLES.join(';')}</code>
      <p style="font-size:.85rem;color:var(--gris)">Juego: pokemon, yugioh, magic, digimon, onepiece, myl, lairen, swu o riftbound. Estado: NM, LP, MP, HP o DMG.</p>
      <p style="font-size:.9rem">2. Guardala como <b>CSV</b> y subila acá. Después podés sumar la foto de cada carta con “Editar”.</p>
      <div class="m-acc" style="justify-content:flex-start"><button class="btn btn-sm" data-a="plantilla">Ver plantilla de ejemplo</button><label class="btn btn-rojo" style="cursor:pointer">Elegir archivo CSV<input type="file" accept=".csv,text/csv" class="sr" data-ch="csvSingles"></label></div>`, true); },
  plantilla:() => mostrarExport('plantilla-singles', aCSV([CSV_SINGLES, ['pokemon','Nombre de la carta','Expansión','025/198','Español','Rara holo','NM','15000','1'], ['yugioh','Otra carta','Set','ABC-SP001','Inglés','Común','LP','2000','4']])),
  exportar:(el) => {
    if(el.dataset.t === 'pedidos') mostrarExport('pedidos', aCSV([['Pedido','Fecha','Cliente','Email','Teléfono','Entrega','Pago','Subtotal','Descuento','Envío','Total','Estado'], ...db.pedidos.map(p => [p.num, fmtFecha(p.fecha), p.cliente.nombre, p.cliente.email, p.cliente.tel, ENT_TXT[p.entrega.tipo], PAGO_TXT[p.pago], p.subtotal, p.descuento, p.envio, p.total, p.estado])]));
    else mostrarExport('productos', aCSV([['ID','Producto','Categoría','Tipo','Precio','Precio anterior','Stock','Máx. por cliente','Vendidos'], ...db.productos.map(p => [p.id, p.nombre, catBy(p.cat).n, p.tipo, p.precio, p.antes||'', p.stock, p.limite||'', p.ventas||0])]));
  },
  aumento:() => {
    abrirModal(`<button class="ico-btn m-x" data-a="mclose" aria-label="Cerrar">${I.x}</button><h2>Aumentar precios por porcentaje</h2><p style="color:var(--gris);font-size:.9rem">Ideal para actualizar por inflación en un solo paso. También ajusta el “precio anterior”.</p>
      <form data-form="aumento" novalidate><div class="form-g"><div class="campo"><label for="au-p">Porcentaje (%)</label><input id="au-p" class="inp" type="number" step="0.5" name="pct" value="10" required></div>
      <div class="campo"><label for="au-c">Aplicar a</label><select id="au-c" class="sel" name="cat"><option value="">Todos los productos</option>${CATS.map(c => `<option value="${c.k}">${c.n}</option>`).join('')}</select></div>
      <div class="campo full"><label for="au-r">Redondear a</label><select id="au-r" class="sel" name="red"><option value="100">$100 más cercanos</option><option value="500">$500 más cercanos</option><option value="1">Sin redondeo</option></select></div></div>
      <div class="m-acc"><button type="button" class="btn" data-a="mclose">Cancelar</button><button class="btn btn-rojo">Aplicar aumento</button></div></form>`); }
};
document.addEventListener('click', e => {
  // Si tocan un link a la misma sección en la que ya están, se re-aplica (cierra menús y sube arriba)
  const lk = e.target.closest('a[href^="#"]');
  if(lk && !lk.dataset.a && lk.getAttribute('href') === (location.hash || '#inicio')){ e.preventDefault(); aplicarRuta(); return; }
  const el = e.target.closest('[data-a]'); if(!el) return;
  if(el.tagName === 'A') e.preventDefault();
  const f = A[el.dataset.a]; if(f) f(el, e);
});
document.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target, k = f.dataset.form;
  if(k === 'buscar'){ st.f.q = f.q.value.trim(); st.f.cat = ''; st.pagina = 1; ir('productos'); }
  if(k === 'generico') guardarForm(f);
  if(k === 'contacto'){
    const n = f.nombre.value.trim(), em = f.email.value.trim(), m = f.mensaje.value.trim();
    if(n.length < 2 || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em) || !m){ toast('Completá nombre, email válido y mensaje'); return; }
    db.mensajes.unshift({nombre:n, email:em, mensaje:(f.dataset.clase ? '['+f.dataset.clase+'] ' : '') + m, fecha:new Date().toISOString()}); guardar();
    track('generate_lead', {tipo: f.dataset.clase ? 'clase' : 'contacto'});
    cerrarModal(); f.reset(); toast('¡Consulta enviada! Te respondemos por email.');
  }
  if(k === 'arrep'){
    const num = f.num.value.trim(), em = f.email.value.trim();
    if(!num || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){ $('#ar-err').textContent = 'Completá el número de pedido y un email válido'; return; }
    const cod = 'ARR-' + Math.random().toString(36).slice(2,8).toUpperCase();
    abrirModal(`<h2>Solicitud recibida</h2><div class="ok-box">Tu código de seguimiento es <b>${cod}</b>. Te escribimos a ${esc(em)} en menos de 24 h. <span class="sim">Simulado en la demo</span></div><div class="m-acc"><button class="btn btn-osc" data-a="mclose">Listo</button></div>`);
  }
  if(k === 'aumento'){
    const pct = +f.pct.value, cat = f.cat.value, red = +f.red.value;
    if(!pct){ toast('Escribí un porcentaje'); return; }
    const R = v => v ? Math.max(red, Math.round(v*(1+pct/100)/red)*red) : v;
    let n = 0; db.productos.forEach(p => { if(!cat || p.cat === cat){ p.precio = R(p.precio); p.antes = R(p.antes); n++; } });
    guardar(); cerrarModal(); render(); toast(`Listo: ${n} precios actualizados ${pct > 0 ? '+' : ''}${pct}%`);
  }
  if(k === 'config'){
    const c = db.config, el = f.elements;
    ['direccion','ciudad','email','instagram','alias','cbu','titular'].forEach(x => c[x] = el[x].value.trim());
    ['descTransfer','envioGratisDesde','costoSMA'].forEach(x => c[x] = Math.max(0, +el[x].value || 0));
    c.descTransfer = Math.min(50, c.descTransfer);
    for(let d = 0; d < 7; d++) c.horarios[d] = el['hx'+d].checked ? null : {a:el['ha'+d].value || '14:00', c:el['hc'+d].value || '21:00'};
    c.zonas.forEach((z,i) => z.costo = Math.max(0, +el['z'+i].value || 0));
    if(guardar()) toast('Configuración guardada ✔'); render();
  }
});
document.addEventListener('change', async e => {
  const el = e.target, k = el.dataset.ch; if(!k) return;
  if(k === 'orden'){ st.f.orden = el.value; st.pagina = 1; refrescarResultados(); }
  if(k === 'ftipo'){ st.f.tipos = el.checked ? [...st.f.tipos, el.value] : st.f.tipos.filter(t => t !== el.value); st.pagina = 1; refrescarResultados(); }
  if(k === 'fbool'){ st.f[el.value] = el.checked; st.pagina = 1; refrescarResultados(); }
  if(k === 'sf'){ st.sf[el.dataset.k] = el.value; render(); }
  if(k === 'co-radio'){ st.co[el.name] = el.value; if(el.name === 'entrega' && el.value !== 'retiro' && st.co.pago === 'local') st.co.pago = 'mp'; render(); }
  if(k === 'co-prov'){ st.co.provincia = el.value; render(); }
  if(k === 'pfestado'){ st.pf.estado = el.value; render(); }
  if(k === 'pfcat'){ st.pf.cat = el.value; render(); }
  if(k === 'estPedido'){ cambiarEstado(el.dataset.num, el.value); render(); }
  if(k === 'pRapido' || k === 'sRapido'){
    const it = (k === 'pRapido' ? db.productos : db.singles).find(x => x.id === el.dataset.id); if(!it) return;
    it[el.dataset.k] = Math.max(0, Math.round(+el.value || 0)); guardar();
    toast({precio:'Precio', antes:'Precio anterior', stock:'Stock'}[el.dataset.k] + ' actualizado ✔');
  }
  if(k === 'formImg'){
    const file = el.files[0]; if(!file) return;
    try{ const d = await achicarImg(file); formImg[el.dataset.k] = d; $('#prev-'+el.dataset.k).src = d; }catch(err){ toast('No se pudo leer esa imagen'); }
  }
  if(k === 'comprobante'){
    const file = el.files[0], p = db.pedidos.find(x => x.num === +el.dataset.num); if(!file || !p) return;
    try{ p.comprobante = file.type.startsWith('image/') ? await achicarImg(file, 900) : 'Archivo: ' + file.name; }catch(err){ p.comprobante = 'Archivo: ' + file.name; }
    guardar(); render(); toast('Comprobante enviado ✔');
  }
  if(k === 'csvSingles'){
    const file = el.files[0]; if(!file) return;
    const txt = await file.text(), filas = leerCSV(txt);
    if(filas.length && filas[0][0].toLowerCase().includes('juego')) filas.shift();
    const juegos = CATS.filter(c => c.tcg).map(c => c.k);
    const nuevos = filas.filter(f => f[1]).map(f => ({id:uid('s'), juego: juegos.includes((f[0]||'').trim().toLowerCase()) ? f[0].trim().toLowerCase() : 'pokemon', nombre:f[1].trim(), expansion:(f[2]||'').trim(), codigo:(f[3]||'').trim(), idioma:(f[4]||'Español').trim(), rareza:(f[5]||'Común').trim(), condicion:((f[6]||'NM').trim().toUpperCase()), precio:Math.round(+(String(f[7]||'0').replace(/[^\d,.]/g,'').replace(/\.(?=\d{3})/g,'').replace(',','.')) || 0), stock:Math.round(+(f[8]||1)) || 0, img:''}));
    if(!nuevos.length){ toast('No encontramos cartas en el archivo. Revisá las columnas.'); return; }
    db.singles = [...nuevos, ...db.singles]; guardar(); cerrarModal(); render(); toast(`Se importaron ${nuevos.length} cartas ✔`);
  }
});
let tDeb;
document.addEventListener('input', e => {
  const el = e.target, k = el.dataset.in; if(!k) return;
  if(k === 'co'){ st.co[el.dataset.k] = el.value; if(st.errores[el.dataset.k]){ delete st.errores[el.dataset.k]; const er = el.parentElement.querySelector('.err'); if(er) er.remove(); } return; }
  clearTimeout(tDeb);
  tDeb = setTimeout(() => {
    if(k === 'fmin' || k === 'fmax'){ st.f[k === 'fmin' ? 'min' : 'max'] = el.value; st.pagina = 1; refrescarResultados(); }
    if(k === 'sq'){ st.sf.q = el.value; render(); const n = document.querySelector('[data-in="sq"]'); if(n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }
    if(k === 'pfq'){ st.pf.q = el.value; render(); const n = document.querySelector('[data-in="pfq"]'); if(n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }
  }, 250);
});
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ if($('#modal').classList.contains('on')) cerrarModal(); else if(st.carrito || st.menu || st.filtrosAb){ st.carrito = st.menu = st.filtrosAb = false; render(); } } });
window.addEventListener('hashchange', aplicarRuta);

/* ---------- Inicio ---------- */
cargar();
cargarMedicion();
aplicarRuta();
</script>
